name: CI

# Branch flow: development -> stable -> main
#   development: active work, tests + secrets scan only, no image build
#   stable:      pre-release gate; builds + pushes an image tagged
#                `stable-<sha>` as a known-good artifact
#   main:        production; builds + pushes `latest` and `<sha>` tags.
#                A bad release is fixed by reverting the merge commit
#                on main (or redeploying a prior `<sha>` tag), not by
#                fixing forward under pressure.
on:
  push:
    branches: [development, stable, main]
  pull_request:
    branches: [development, stable, main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  secrets-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # gitleaks scans git history, so it needs full history, not
          # just the latest commit (actions/checkout defaults to depth 1)
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If you hit false positives, add a .gitleaks.toml at the repo
          # root with a scoped [allowlist] entry rather than disabling
          # the scan.

  build-and-push:
    name: Build and push Docker image
    needs: [test, secrets-scan]
    runs-on: ubuntu-latest
    # Only build/push on direct pushes (i.e. merges) to stable or main —
    # never on development, and never on PRs (which are just proposed
    # merges, not the real thing yet).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags for this branch
        id: tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${{ github.repository }}:stable-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        run: |
          TAG_ARGS=$(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/-t /' | tr '\n' ' ')
          docker build $TAG_ARGS .

      # Next steps to add yourself as you work through the plan:
      #   - Trivy vulnerability scan of the built image
      #   - cosign signing of the pushed image
      - name: Push image
        run: |
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | xargs -L1 docker push
